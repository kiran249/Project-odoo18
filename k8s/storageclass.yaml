# EBS gp3 disks for Postgres and Odoo data.
# Needs the "Amazon EBS CSI Driver" add-on installed on the EKS cluster.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
