# Values for the kube-prometheus-stack Helm chart.
# Prometheus -> http://<load-balancer-address>:9090   Grafana -> http://<load-balancer-address>

alertmanager:
  enabled: false

prometheus:
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  prometheusSpec:
    retention: 7d
    # Scrape the postgres-exporter sidecar running next to Postgres
    additionalScrapeConfigs:
      - job_name: postgres
        static_configs:
          - targets: ["postgres.odoo.svc.cluster.local:9187"]

grafana:
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  admin:
    existingSecret: grafana-admin       # created by the Jenkins pipeline
    userKey: admin-user
    passwordKey: admin-password
  # Extra dashboard for PostgreSQL (Kubernetes dashboards are built in)
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: extra
          folder: Extra
          type: file
          options:
            path: /var/lib/grafana/dashboards/extra
  dashboards:
    extra:
      postgres:
        gnetId: 9628
        revision: 7
        datasource: Prometheus
